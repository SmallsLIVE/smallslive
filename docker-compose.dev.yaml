services:
  web:
    build: .
    container_name: smallslive_web
    command: python manage.py runserver 0.0.0.0:8000
    develop:
      watch:
        - action: sync+restart
          path: ./smallslive
          target: /app
          ignore:
            - __pycache__/
            - static/
            - templates/

        - action: sync
          path: ./smallslive/templates
          target: /app/templates

        - action: sync
          path: ./smallslive/staticfiles
          target: /app/staticfiles

    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=web
    depends_on:
      - db

  celery:
    build: .
    container_name: smallslive_celery
    command: celery worker -A smallslive -l info --workdir smallslive
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=celery
    depends_on:
      - db
      - redis

  redis:
    image: redis:7
    container_name: smallslive_redis
    restart: always
    ports:
      - "6380:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: smallslive_es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  db:
    image: postgres:15
    container_name: smallslive_db
    restart: always
    environment:
      POSTGRES_DB: smallslivedb_new
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT}:5432"

volumes:
  postgres_data:
  es_data:
