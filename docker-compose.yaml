services:
  web:
    build: .
    container_name: smallslive_web
    command: gunicorn smallslive.wsgi:application --bind 0.0.0.0:8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=web

  celery:
    build: .
    container_name: smallslive_celery
    command: celery worker -A smallslive -l info --workdir smallslive
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=celery
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: smallslive_redis
    restart: always
    ports:
      - "6380:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: smallslive_es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=changeme
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:changeme -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  es_data:
