# Used for deploying production

services:
  web:
    build: .
    container_name: smallslive_web
    command: gunicorn smallslive.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 120
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=web
    volumes:
      - ./smallslive/static:/app/static
      - ./smallslive/media:/app/media
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6G
        reservations:
          cpus: '1.5'
          memory: 4G
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: smallslive/prod
        awslogs-stream: web
        awslogs-create-group: "true"

  celery:
    build: .
    container_name: smallslive_celery
    command: celery -A smallslive worker -l info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=50 --workdir smallslive
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=celery
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
            cpus: '0.5'
            memory: 1G
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: smallslive/prod
        awslogs-stream: celery
        awslogs-create-group: "true"

  celerybeat:
    build: .
    container_name: smallslive_celerybeat
    command: celery beat -A smallslive -l info --workdir smallslive
    env_file:
      - .env
    environment:
      - SERVICE_TYPE=celerybeat
    depends_on:
      - redis
      - celery

    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 700M
        reservations:
          cpus: '0.1'
          memory: 300M
    restart: always
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: smallslive/prod
        awslogs-stream: celerybeat
        awslogs-create-group: "true"

  redis:
    image: redis:7
    container_name: smallslive_redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 700M
        reservations:
            cpus: '0.2'
            memory: 300M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: smallslive_es
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=changeme
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 4G
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:changeme -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  es_data:
